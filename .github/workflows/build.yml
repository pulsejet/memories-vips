name: build-static-cli

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-musl-x64
            asset: linux-x64
            runner: ubuntu-24.04
          - platform: linux-musl-arm64
            asset: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream (no fork, archive at pin)
        run: ./fetch-upstream.sh

      - name: Build upstream image (unmodified)
        run: docker build --pull -t vips-dev-${{ matrix.platform }} platforms/${{ matrix.platform }}

      - name: Upstream deps + camera static extras (same container lifetime)
        run: |
          docker run --rm -v "$PWD:/packaging" vips-dev-${{ matrix.platform }} \
            sh -c "/packaging/build-deps-only.sh && /packaging/build-camera-extras.sh"
          mv ./vips-cli-${{ matrix.platform }}-static.tar.gz ./vips-cli-${{ matrix.asset }}-static.tar.gz
          ls -lh ./*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: vips-cli-${{ matrix.asset }}-static
          path: vips-cli-${{ matrix.asset }}-static.tar.gz

  release:
    # Tags are named v{upstream}-{build}, e.g. v8.18.5-1 (see README).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: |
            `vips-cli-linux-x64-static` + `vips-cli-linux-arm64-static`
            (musl-static, runs on musl and glibc≥2.28).
