name: editor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  editor:
    # Pure-TS preview library: install, typecheck, unit tests, demo bundle.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Demo bundle
        run: npm run build
