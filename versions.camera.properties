# Camera-extras pins, overlaid on upstream kleisauke/libvips-packaging versions.properties.
# Do NOT edit upstream file. Bump here + build-camera-extras.sh. Rebase upstream by bumping UPSTREAM_TAG.
UPSTREAM_REPO=kleisauke/libvips-packaging
UPSTREAM_TAG=v8.18.5

# Delta deps (static-only, not in upstream). All versions verified 2026-10-10.
VERSION_BROTLI=1.2.0
VERSION_DAV1D=1.5.4
VERSION_LIBDE265=1.0.16
VERSION_X265=4.1
VERSION_OPENJPEG=2.5.4
VERSION_IMATH=3.1.12
VERSION_OPENEXR=3.2.4
VERSION_LIBRAW=0.22.2
VERSION_LIBJXL=0.12.0

# libheif rebuilt with these codecs built-in (no plugins, no dlopen).
# aom/dav1d cover AV1 decode, aom covers AV1 encode, x265+libde265 cover HEVC.
# svt-av1/rav1e intentionally OFF (aom already covers AV1 encode; keeps Rust out of the chain).
HEIF_WITH_X265=1
HEIF_WITH_LIBDE265=1
HEIF_WITH_AOM=1
HEIF_WITH_DAV1D=1
