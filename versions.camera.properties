# Camera-extras pins, overlaid on upstream kleisauke/libvips-packaging versions.properties.
# Do NOT edit upstream file. Bump here + build-camera-extras.sh. Rebase upstream by bumping UPSTREAM_TAG.
UPSTREAM_REPO=kleisauke/libvips-packaging
UPSTREAM_TAG=v8.18.7

# Delta deps (static-only, not in upstream). All versions verified 2026-10-23.
VERSION_DAV1D=1.5.4
VERSION_LIBDE265=1.0.19
VERSION_SVT_AV1=4.2.0
VERSION_IMATH=3.1.12
VERSION_OPENEXR=3.2.12
VERSION_LIBRAW=0.22.2

# libheif rebuilt with these codecs built-in (no plugins, no dlopen).
# dav1d covers AV1 decode, SVT-AV1 covers AV1 encode, libde265 covers HEVC decode.
# HEVC encode (x265) and AOM are intentionally OFF: no HEVC output needed,
# SVT-AV1 replaces aom for AV1 encode (faster, keeps Rust out of the chain).
HEIF_WITH_X265=0
HEIF_WITH_LIBDE265=1
HEIF_WITH_AOM_ENCODER=0
HEIF_WITH_AOM_DECODER=0
HEIF_WITH_DAV1D=1
HEIF_WITH_SVTENC=1
